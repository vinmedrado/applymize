services:
  db:
    image: postgres:16
    container_name: applymize_db
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: applymize
      POSTGRES_PASSWORD: applymize
      POSTGRES_DB: applymize
    ports:
      - "5434:5432"
    volumes:
      - applymize_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applymize -d applymize"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: applymize_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: applymize_evolution
    environment:
      TZ: America/Sao_Paulo
      AUTHENTICATION_API_KEY: applymize_local_key
      SERVER_URL: http://evolution:8080
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://applymize:applymize@db:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: applymize_evolution
      STORE_MESSAGES: "true"
      STORE_CONTACTS: "true"
      CONFIG_SESSION_PHONE_CLIENT: Chrome
      CONFIG_SESSION_PHONE_NAME: Chrome
      CONFIG_SESSION_PHONE_VERSION: 2.2412.54
      CONFIG_SESSION_BROWSER: Chrome
      CONFIG_SESSION_OS: Windows
      QRCODE_LIMIT: 30
      QRCODE_COLOR: "#198754"
    ports:
      - "8080:8080"
    volumes:
      - applymize_evolution_instances:/evolution/instances
      - applymize_evolution_store:/evolution/store
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    container_name: applymize_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      APP_TIMEZONE: America/Sao_Paulo
      DATABASE_URL: postgresql+psycopg2://applymize:applymize@db:5432/applymize
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
      CORS_ORIGIN_REGEX: "^http://(192\\.168\\.[0-9]{1,3}\\.[0-9]{1,3}|10\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}|172\\.(1[6-9]|2[0-9]|3[01])\\.[0-9]{1,3}\\.[0-9]{1,3}):5173$"
      AUTO_SEED: "false"
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: applymize_local_key
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      evolution:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: applymize_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  applymize_pgdata:
  applymize_evolution_instances:
  applymize_evolution_store:
