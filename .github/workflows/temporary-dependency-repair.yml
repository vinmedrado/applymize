name: Temporary Applymize dependency remediation
on:
  push:
    branches: [ci/security-review-20261111]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/security-review-20261111
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply nonbreaking npm security updates
        working-directory: frontend
        run: |
          npm install --save-exact react-router-dom@7.18.5 --ignore-scripts --no-fund
          npm audit fix --ignore-scripts --no-fund || true
      - name: Validate reproducible frontend build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
      - name: Report remaining production advisories
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high || true
      - name: Commit updated lockfile to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): apply compatible npm dependency patches"
            git push origin HEAD:ci/security-review-20261111
          fi
